<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maxtrade</title>
    <script>
      // Apply the saved (or OS) theme before first paint; src/theme.js takes over after.
      try {
        var t = localStorage.getItem("maxtrade-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <meta name="description" content="Personal stock screening and portfolio tracking tool. Not affiliated with the Indonesia Stock Exchange or Google." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
